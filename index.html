<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prototipo Criptográfico AES/RSA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #f0f2f5; color: #333; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 25px; border-top: 5px solid #003366; }
        h1, h2 { color: #003366; text-align: center; }
        textarea { width: 100%; height: 100px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; padding: 10px; box-sizing: border-box; font-family: monospace; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        button { flex: 1; background: #003366; color: white; border: none; padding: 12px; cursor: pointer; border-radius: 6px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #0055aa; }
        .decrypt-section { border-top: 5px solid #d9534f; }
        label { font-weight: bold; display: block; margin-top: 15px; }
    </style>
</head>
<body>
    <h1>Seguridad en Cómputo: Prototipo Criptográfico</h1>
    
    <div class="card">
        <h2>1. Generación de Llaves (RSA)</h2>
        <button onclick="generateRSA()">Generar Par de Llaves RSA</button>
        <label>Llave Pública (Cifra la llave AES):</label>
        <textarea id="publicKey" readonly placeholder="Aquí aparecerá la llave pública..."></textarea>
        <label>Llave Privada (Descifra la llave AES):</label>
        <textarea id="privateKey" readonly placeholder="Aquí aparecerá la llave privada..."></textarea>
    </div>

    <div class="card">
        <h2>2. Cifrado (Envío)</h2>
        <label>Mensaje (Entrada):</label>
        <textarea id="msgInput" placeholder="Escribe el mensaje que deseas proteger..."></textarea>
        <button onclick="encryptProcess()">Ejecutar Cifrado AES + RSA</button>
        
        <label>Llave AES Cifrada (con RSA):</label>
        <textarea id="encAesKeyOutput" readonly></textarea>
        <label>Mensaje Cifrado (con AES):</label>
        <textarea id="encMsgOutput" readonly></textarea>
    </div>

    <div class="card decrypt-section">
        <h2>3. Descifrado (Recepción)</h2>
        <p><small>Para probar, los datos de arriba se copiarán aquí automáticamente al presionar el botón.</small></p>
        <button onclick="decryptProcess()" style="background: #d9534f;">Ejecutar Descifrado RSA + AES</button>
        
        <label>Mensaje Original Descifrado:</label>
        <textarea id="finalDecryptedMsg" readonly style="background: #e9f7ef; border: 1px solid #28a745;"></textarea>
    </div>

    <script>
        let crypt = new JSEncrypt({default_key_size: 1024});

        function generateRSA() {
            crypt.getKey();
            document.getElementById('publicKey').value = crypt.getPublicKey();
            document.getElementById('privateKey').value = crypt.getPrivateKey();
        }

        function encryptProcess() {
            const message = document.getElementById('msgInput').value;
            const pubKey = document.getElementById('publicKey').value;
            if(!message || !pubKey) return alert("Ingresa un mensaje y genera las llaves primero.");

            // A. Cifrar con AES
            const aesKey = CryptoJS.lib.WordArray.random(16).toString();
            const encryptedMsg = CryptoJS.AES.encrypt(message, aesKey).toString();

            // B. Cifrar clave AES con RSA
            crypt.setPublicKey(pubKey);
            const encryptedAESKey = crypt.encrypt(aesKey);

            document.getElementById('encAesKeyOutput').value = encryptedAESKey;
            document.getElementById('encMsgOutput').value = encryptedMsg;
        }

        function decryptProcess() {
            const privKey = document.getElementById('privateKey').value;
            const encAesKey = document.getElementById('encAesKeyOutput').value;
            const encMsg = document.getElementById('encMsgOutput').value;

            if(!privKey || !encAesKey || !encMsg) return alert("Faltan datos para descifrar.");

            // C. Descifrar clave AES con RSA
            crypt.setPrivateKey(privKey);
            const decryptedAesKey = crypt.decrypt(encAesKey);

            if(!decryptedAesKey) return alert("Error: La llave privada no coincide.");

            // D. Descifrar mensaje con AES
            const bytes = CryptoJS.AES.decrypt(encMsg, decryptedAesKey);
            const originalText = bytes.toString(CryptoJS.enc.Utf8);

            document.getElementById('finalDecryptedMsg').value = originalText;
        }
    </script>
</body>
</html>
